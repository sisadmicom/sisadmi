services:
  db:
    image: postgres:15
    container_name: sisadmi-db
    restart: always
    env_file:
      - .env
    volumes:
      - sisadmi_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      retries: 10

  web:
    build: .
    container_name: sisadmi-web
    working_dir: /app
    # El script de espera ahora se ejecuta desde /app (no /src)
    command: bash -c "./wait_for_db.sh && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./src:/app
      - ./src/wait_for_db.sh:/app/wait_for_db.sh  # asegura que el script esté disponible
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  nginx:
    image: nginx:latest
    container_name: sisadmi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/staticfiles:/static
    depends_on:
      - web

volumes:
  sisadmi_db_data:
