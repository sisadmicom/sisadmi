#src/sales/templates/sales/invoice/invoice_form.html
{% extends "base.html" %}

{% block content %}

<h2>Crear Factura</h2>

<form method="post">
    {% csrf_token %}

    <!-- Cliente -->
    <label>Cliente:</label>
    <input type="text" name="customer" required>

    <!-- Líneas -->
    <table id="invoice-lines">
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <button type="button" onclick="addLine()">➕ Agregar línea</button>

    <hr>

    <!-- Totales -->
    <p>Subtotal: <span id="subtotal">0.00</span></p>
    <p>IVA (15%): <span id="tax">0.00</span></p>
    <p><strong>Total: <span id="total">0.00</span></strong></p>

    <button type="submit">Guardar</button>

</form>

<script>
const IVA_RATE = 0.15;

function addLine() {
    const table = document.querySelector("#invoice-lines tbody");

    const row = document.createElement("tr");

    row.innerHTML = `
        <td><input type="text" name="product[]"></td>
        <td><input type="number" name="quantity[]" value="1" step="1" onchange="calculateTotals()"></td>
        <td><input type="number" name="price[]" value="0" step="0.01" onchange="calculateTotals()"></td>
        <td class="line-subtotal">0.00</td>
        <td><button type="button" onclick="removeLine(this)">❌</button></td>
    `;

    table.appendChild(row);
}

function removeLine(btn) {
    btn.closest("tr").remove();
    calculateTotals();
}

function calculateTotals() {
    let subtotal = Decimal("0.00");

    document.querySelectorAll("#invoice-lines tbody tr").forEach(row => {
        const qty = parseFloat(row.querySelector("input[name='quantity[]']").value) || 0;
        const price = parseFloat(row.querySelector("input[name='price[]']").value) || 0;

        const lineSubtotal = qty * price;
        row.querySelector(".line-subtotal").innerText = lineSubtotal.toFixed(2);

        subtotal += lineSubtotal;
    });

    const tax = subtotal * IVA_RATE;
    const total = subtotal + tax;

    document.getElementById("subtotal").innerText = subtotal.toFixed(2);
    document.getElementById("tax").innerText = tax.toFixed(2);
    document.getElementById("total").innerText = total.toFixed(2);
}
</script>

{% endblock %}
